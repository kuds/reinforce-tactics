# PPO bootstrap validation slice -- cold-start probe for Colab L4
# ===============================================================
# Purpose: check that the bootstrap pipeline works end to end on the fixed
# code BEFORE committing to the multi-day 3-seed run of
# `configs/ppo/bootstrap.yaml`. It is that file's first 8 stages (the whole
# starter block, then beginner up to the historical wall stage
# beginner_random_15) with the same env, reward_config, ppo, eval and gate
# settings and the same thresholds. Only three things differ:
#   * max_timesteps / anneal_horizon are cut to about half (per stage below);
#   * eval.eval_freq is 50_000, not 100_000, so short stages get 3+ evals;
#   * curriculum.max_retries is 0: a stall ends the probe.
# Keep everything else in sync with bootstrap.yaml
# (tests/test_shipped_configs.py checks it). Rationale for the settings:
# docs/validation_run_config.md.
#
# What this validates:
#   1. Cold start: starter_simple reaches a non-zero stochastic win rate
#      within 100-200k steps, in both seats.
#   2. The starter ladder (simple -> mix(random/simple) -> random ->
#      mix(random/medium) -> medium) promotes under the Wilson gate; if
#      starter_medium walls, compare its per-seat win rates (seat 2 against
#      MediumBot moving first is the expected hard half).
#   3. The map change to beginner.csv does not collapse the value function.
#   4. beginner_random_15, the stage most archived runs stalled at, shows an
#      upward trend (clearing it is a bonus, not required).
#
# Probe contract (docs/bootstrap_lessons_learned.md "Single-map probe
# pattern"): confirm win rate > 0 with std > 0 within the first 3-5 evals
# of each stage; if not, abort and diagnose, don't extend. Track avg_turns:
# a monotonic climb toward max_turns is the draw-attractor signature. Also
# read the per-seat win rates and flat_truncated_rate in eval_results.jsonl.
#
# Run from notebook ppo_bootstrap.ipynb:
#   CONFIG_PATH = Path("configs/ppo/bootstrap_validation.yaml")
#   BUILD_BC_WARMSTART = False   # cold start, no BC
algorithm: maskable_ppo
seed: 42
# Budget: 4.75M env steps (sum of max_timesteps; no retries). ~2 h expected,
# ~4.5 h if every stage runs out its budget, on the L4. The curriculum
# runner ignores a top-level total_timesteps (--strict rejects it).

env:
  n_envs: 8
  use_subprocess: true
  agent_seat: random
  max_turns: 20
  max_actions_per_turn: 60
  # max_steps = ceil((max_turns * 61 + 60) / 100) * 100: never truncates
  # before the max_turns clock (see bootstrap.yaml).
  max_steps: 1300
  action_space_type: flat_discrete
  # Identical to bootstrap.yaml's reward_config (comments there), so the
  # probe tests the production reward landscape.
  reward_config:
    win_by_hq_capture: 80.0
    win_by_elimination: 50.0
    win: 50.0
    loss: -50.0
    draw: -50.0
    truncation: 0.0
    income_diff: 0.05
    unit_diff: 0.0
    structure_control: 1.0
    create_unit: 0.0
    move: 0.0
    damage_scale: 0.002
    damage_taken_scale: -0.002
    kill: 0.2
    unit_lost: 0.0
    seize_progress: 3.0
    capture: 10.0
    tower_capture: 15.0
    building_capture: 40.0
    hq_capture: 60.0
    cure: 0.0
    heal_scale: 0.0
    paralyze: 0.0
    haste: 0.0
    defence_buff: 0.0
    attack_buff: 0.0
    invalid_action: -0.1
    turn_penalty: -1.0
    win_speed_bonus: 0.0
    enemy_neutral_capture: -8.0
    enemy_owned_capture: 0.0

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
    features_extractor_class: reinforcetactics.rl.extractors.SpatialFeatureExtractor
    features_extractor_kwargs:
      features_dim: 256
      pool: masked_avg
      coord_conv: true
      extra_conv: true

eval:
  # Probe cadence: twice bootstrap.yaml's 100_000.
  eval_freq: 50_000
  # Per seat: 60 x 2 seats = 120 pooled episodes, as in bootstrap.yaml
  # (the thresholds are matched to n = 120).
  n_eval_episodes: 60
  eval_seats: [1, 2]
  seat_aggregate: mean
  eval_deterministic: false
  eval_both_modes: false
  n_eval_envs: 8
  eval_use_subprocess: true
  checkpoint_freq: 50_000

curriculum:
  # Same gate as bootstrap.yaml: T = round(wilson_lower_bound(ceil(120 * t),
  # 120, z_for_confidence(0.95)), 2) for the intended stochastic win rate t.
  promotion_criterion: wilson
  promotion_confidence: 0.95
  promotion_score: win_rate
  # Probe contract: abort and diagnose a stall, don't extend it.
  max_retries: 0
  regression_guard_evals: 3
  regression_guard_drop: 0.25
  stages:
    # ---- starter (20 turns): cold start ----
    - name: starter_simple
      map_file: maps/1v1/starter.csv
      opponent: simple
      promotion_win_rate: 0.73      # t 0.80
      patience: 2
      max_timesteps: 300_000        # bootstrap.yaml 500_000
      anneal_horizon: 200_000       # bootstrap.yaml 300_000
      min_timesteps_before_promotion: 25_000
      ent_coef: {start: 0.10, end: 0.05, schedule: linear}

    - name: starter_mixed_random_simple
      map_file: maps/1v1/starter.csv
      opponent: mixed
      opponent_kwargs: {easy: random, hard: simple, p_hard: 0.5}
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 300_000        # bootstrap.yaml 500_000
      anneal_horizon: 200_000       # bootstrap.yaml 300_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    - name: starter_random
      map_file: maps/1v1/starter.csv
      opponent: random
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 400_000        # bootstrap.yaml 750_000
      anneal_horizon: 250_000       # bootstrap.yaml 400_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    - name: starter_mixed_random_medium
      map_file: maps/1v1/starter.csv
      opponent: mixed
      opponent_kwargs: {easy: random, hard: medium, p_hard: 0.5}
      promotion_win_rate: 0.63      # t 0.70
      patience: 2
      max_timesteps: 500_000        # bootstrap.yaml 1_000_000
      anneal_horizon: 300_000       # bootstrap.yaml 500_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    - name: starter_medium
      map_file: maps/1v1/starter.csv
      opponent: medium
      promotion_win_rate: 0.53      # t 0.60
      patience: 2
      max_timesteps: 750_000        # bootstrap.yaml 1_500_000
      anneal_horizon: 400_000       # bootstrap.yaml 750_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    # ---- beginner (6x6, 75 turns) ----
    - name: beginner_balanced_random
      map_file: maps/1v1/beginner.csv
      opponent: balanced_random
      promotion_win_rate: 0.79      # t 0.85
      patience: 2
      max_timesteps: 500_000        # bootstrap.yaml 1_000_000
      anneal_horizon: 300_000       # as bootstrap.yaml
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    - name: beginner_random_10
      map_file: maps/1v1/beginner.csv
      opponent: random
      opponent_kwargs: {max_actions: 10}
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 1_000_000      # bootstrap.yaml 3_000_000
      anneal_horizon: 600_000       # bootstrap.yaml 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    - name: beginner_random_15
      map_file: maps/1v1/beginner.csv
      opponent: random
      opponent_kwargs: {max_actions: 15}
      promotion_win_rate: 0.63      # t 0.70
      patience: 2
      max_timesteps: 1_000_000      # bootstrap.yaml 3_000_000
      anneal_horizon: 600_000       # bootstrap.yaml 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.01, schedule: linear}

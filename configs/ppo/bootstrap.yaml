# PPO bootstrap curriculum: the canonical config for the 3-seed validation run
# (docs/REVIEW_full_2026-09-26.md §2.1), hardware-tuned for Google Colab on an
# L4 GPU (high-RAM tier, 12 vCPUs verified via ``!nproc``).
#
# Every change from the 33-stage curriculum, with its evidence and the
# judgment calls worth revisiting, is in docs/validation_run_config.md; how to
# launch, resume and report the run is in docs/validation_run.md.
#
# Loaded by reinforcetactics.rl.config.load_config into a TrainingConfig.
# Stages live under curriculum.stages; a stage that exhausts `max_timesteps`
# without promoting is retried (curriculum.max_retries) and then raises
# CurriculumStalled. Run with --strict; resume a killed run with
# train_bootstrap.py --resume RUN_DIR (or re-run the same --resume-if-exists
# command, as scripts/train/run_seeds.py does; a seed group continues with
# run_seeds.py --group <id>).
#
# Hardware tuning (env.n_envs / env.use_subprocess / ppo.batch_size /
# eval.n_eval_envs / eval.eval_use_subprocess) targets the L4 + 12-vCPU
# tier. On free Colab (2 vCPUs) drop env.n_envs and eval.n_eval_envs to 2.
algorithm: maskable_ppo
# One seed per run; the validation run launches three (42, 1042, 2042) with
# scripts/train/run_seeds.py, which passes train_bootstrap.py --seed N.
seed: 42
# Budget: 55.25M env steps if every stage runs out its max_timesteps, 106.5M
# if each also spends its retry (the capstone has none). Prior for a normal
# run: ~21M steps, ~24 h per seed on the L4 (docs/validation_run_config.md).
# The curriculum runner ignores a top-level total_timesteps (--strict rejects
# it), so the number lives in this comment.

env:
  # 8 envs leaves headroom on a 12-vCPU machine for the main process
  # (PPO update + eval) without contention. SubprocVecEnv is required
  # for real CPU parallelism with n_envs > 1.
  n_envs: 8
  use_subprocess: true
  # Train in both seats (review critic-gaps-2): each training episode draws
  # the agent's seat, so the opponent moves first in half of them, as it
  # does in tournaments and the GUI. The gate evaluates both seats (eval).
  agent_seat: random
  # Game clock of the starter stages; the other maps set their own per stage
  # (beginner and intermediate 75, skirmish 120, corner_points 200).
  max_turns: 20
  # Per-turn cap on agent actions: after 60 actions in one game turn the
  # mask narrows to end_turn only. A safety net against the "never end the
  # turn" attractor, sized so it rarely binds: a trained v50 policy on
  # skirmish took median 26 / p90 37 / max 41 steps per turn, and random
  # play maxes at 57 there. Random play on corner_points hits it on ~21% of
  # turns; watch that if a seed gets there. The per-turn counter is not in
  # the observation, so the cap is not meant to shape play.
  max_actions_per_turn: 60
  # max_steps must never end an episode before the max_turns clock does:
  # truncation pays reward_config.truncation (0) plus SB3's bootstrap of the
  # truncated state, which would make it a cheaper exit than a max-turns
  # draw. A policy that follows the action mask (MaskablePPO always does)
  # spends at most max_actions_per_turn + 1 steps per turn, so every stage
  # uses
  #   max_steps = ceil((max_turns * 61 + 60) / 100) * 100
  # 1300 here (20 turns); per stage 4700 (75), 7400 (120), 12300 (200).
  # Change max_actions_per_turn or a stage's max_turns and this must follow
  # (tests/test_shipped_configs.py checks it).
  max_steps: 1300
  action_space_type: flat_discrete
  # Every stage's observations are padded to the largest curriculum map
  # (corner_points, 10x12). The runner would resolve the same value from the
  # maps; it is written out so a file with only the small maps (the slice,
  # bootstrap_validation.yaml) trains on the same inputs: coord_conv's
  # position planes span the padded grid, so an unpadded 6x6 map would see
  # different coordinates (and ~3.7x less compute per update).
  pad_to_size: [10, 12]
  # max_flat_actions stays at the 512 default (decision recorded for review
  # rlenv-11 / prior-13, which proposed 1024 here). The case for 1024 was
  # that on skirmish / corner_points (728-744 legal actions) truncation
  # dropped casts, heals and attacks first, so a big army could not fight.
  # An untrained policy reaches 770-805 legal actions on corner_points (the
  # runbook's smoke test), and 15-17% of its decision points there are cut.
  # flat_action_version 2 (the env default for new runs) drops only moves
  # there, shared round-robin across units, and keeps every attack, heal,
  # cast, seize and end_turn. What it still drops is visible now
  # (episode_stats truncated_steps / max_legal_actions, eval
  # flat_truncated_rate); raise the cap if the validation run shows it
  # biting. 1024 remains a sweep axis (v52b / v53 / v54): it doubles the
  # Discrete head and makes 512-head checkpoints unusable as warm starts.
  #
  # engine_overrides: optional sparse overlay over the non-YAML engine
  # constants (constants.py). Unset here: the run plays the deployed engine,
  # the one the scripted-bot ladder was measured on. v50-v52a's
  # damage_model: hp_scaled and unit_data W cost 300 are deliberately not
  # back-ported (docs/validation_run_config.md). Example of the syntax:
  #
  # engine_overrides:
  #   starting_gold: 250
  #   unit_data:               # sparse: only the deltas you want
  #     K: {defence: 5}
  reward_config:
    # The deepest archived run's values (v52a_maxturn_scaled_draw, 20 of 33
    # stages), back-ported per review rltrain-14 / prior-4. Every key the env
    # reads is set, so none falls back to the 1000-scale
    # DEFAULT_REWARD_CONFIG. Terminals are ~50: prior runs at the ~5000 scale
    # showed value_loss climbing without bound.
    #
    # Terminals. 96-100% of archived wins are eliminations. The HQ values
    # (here and hq_capture) are v49's, kept for parity with v52a; HQ endings
    # stayed at 0.3-4% of eval episodes after v49 raised them.
    win_by_hq_capture: 80.0
    win_by_elimination: 50.0
    win: 50.0                # any other winning end_reason
    loss: -50.0
    # draw equals loss. turn_penalty makes a full-clock draw cost
    # draw + turn_penalty * max_turns: -70 (starter), -125 (beginner,
    # intermediate), -170 (skirmish), -250 (corner_points).
    draw: -50.0
    # max_steps truncation (unreachable here, see env.max_steps).
    truncation: 0.0
    # Potential-based shaping, paid as gamma * Phi(s') - Phi(s) with Phi =
    # income_diff * (income difference) + unit_diff * (unit-count
    # difference) + structure_control * (structure difference). Policy-
    # invariant under the discounted return, but the undiscounted eval sum
    # carries -(1 - gamma) * sum_t Phi(s_t), which grows with episode length.
    # unit_diff is 0 (v49): it paid for cheap-unit spam.
    income_diff: 0.05
    unit_diff: 0.0
    structure_control: 1.0
    create_unit: 0.0
    move: 0.0
    # Combat shaping on HP actually removed, both sides (v34+ / v49):
    # damage_taken_scale mirrors damage_scale, so an even trade nets ~0 and
    # only decisive combat pays. Counter-attacks count on both sides. It is a
    # small stream (+5..+24 per episode in the archive's evals).
    damage_scale: 0.002
    damage_taken_scale: -0.002
    kill: 0.2
    unit_lost: 0.0           # off, as in v52a (the key did not exist then)
    # Paid per seize action. The largest dense stream (35-68 per episode on
    # beginner / intermediate, 147-282 on skirmish in the archive) and a
    # known farm: partial seizes pay without a capture. 3.0 for parity with
    # v52a; 1.0 is the first one-knob follow-up arm.
    seize_progress: 3.0
    # Per-structure capture rewards (capture is the fallback, unused while
    # all three per-type keys are set). The HQ pays most (v49: it used to
    # pay less than a building).
    capture: 10.0
    tower_capture: 15.0
    building_capture: 40.0
    hq_capture: 60.0
    # Support abilities: explicit zeros (the env defaults are nonzero).
    cure: 0.0
    heal_scale: 0.0
    paralyze: 0.0
    haste: 0.0
    defence_buff: 0.0
    attack_buff: 0.0
    invalid_action: -0.1
    # Charged per end_turn: the clock-scaled draw deterrent (v52a). With
    # draw == loss it also makes a fast loss cheaper than a full-clock draw;
    # the per-turn cap above keeps "never end the turn" from dodging it.
    turn_penalty: -1.0
    # Both 0. Every archived run that cleared beginner_random_20 had
    # win_speed_bonus 0, enemy_owned_capture 0 and turn_penalty <= -0.5; 0
    # of 20 runs with win_speed_bonus 50 and enemy_owned_capture -15 did.
    # The v27 bisection re-added each alone and each stalled
    # beginner_random_10 (v27a, v27c).
    win_speed_bonus: 0.0
    # Charged per tile the opponent seizes: a neutral (the capture race) or
    # one the agent held. -8 for neutrals was shown benign (v27b).
    enemy_neutral_capture: -8.0
    enemy_owned_capture: 0.0

ppo:
  # Unchanged, and identical to v52a (and every archived run).
  learning_rate: 3.0e-4
  n_steps: 2048             # 2048 * 8 = 16384 transitions per PPO update
  batch_size: 256           # bumped from 64 -- L4 absorbs much bigger minibatches
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
    # CNN trunk over the (grid, units) spatial planes. Without this SB3's
    # default ``CombinedExtractor`` flattens both planes — the policy
    # then has to relearn map adjacency from a flat vector and pays a
    # large parameter cost on the first Linear layer (input grows with
    # H * W * channels). ``pool: masked_avg`` makes the trunk's output
    # size independent of ``pad_to_size`` *and* skips padded cells in
    # the spatial average, which matters because early-curriculum stages
    # train on 6x6 maps padded up to (10, 12) — under plain ``avg`` the
    # global average pool would be ~70% zero-padding noise on those
    # stages. ``coord_conv`` prepends two normalized (y, x) channels so
    # the policy can reason about absolute position (HQ corner, etc.)
    # without spending conv capacity rediscovering it. ``extra_conv``
    # adds a 4th 3x3 conv block, lifting the receptive field from ~7x7
    # to ~9x9 — most of corner_points (10x12) in one CNN look.
    features_extractor_class: reinforcetactics.rl.extractors.SpatialFeatureExtractor
    features_extractor_kwargs:
      features_dim: 256
      pool: masked_avg
      coord_conv: true
      extra_conv: true

eval:
  # Env steps across all sub-envs (cumulative, so a stage's first in-stage
  # eval lands up to 100k after its carry-in eval). Eval dominates
  # wall-clock (72-94% in v52a); 100k with the stochastic policy only is
  # ~24 h expected per seed, against ~42 h for 100k with both modes.
  eval_freq: 100_000
  # Per seat: 60 x 2 seats = 120 pooled episodes per eval. The thresholds
  # below are matched to n = 120; change this and recompute them.
  n_eval_episodes: 60
  eval_seats: [1, 2]
  # The gate pools both seats. `min` would make the *_medium stages nearly
  # impassable: scripted bots beat MediumBot moving first in at most 24% of
  # games on starter and beginner (RandomBot) and 8% on intermediate.
  seat_aggregate: mean
  # Gate, best_model.zip and stall verdicts use the stochastic policy (the
  # one PPO trains). The greedy number is not recorded per eval: that would
  # nearly double eval time. For the v52a comparison, evaluate each stage's
  # best_model.zip in both modes after the run.
  eval_deterministic: false
  eval_both_modes: false
  # 8 eval envs in worker processes, one batched predict per step. Assumed
  # ~2.5x faster than serial on the L4; on an idle 4-vCPU CPU box they ran
  # 1.9-2.5x faster (untrained policy). If it underperforms, n_eval_envs 4
  # in-process measured 1.5-1.7x.
  n_eval_envs: 8
  eval_use_subprocess: true
  # Stage-relative steps between rolling latest.zip checkpoints, which
  # train_bootstrap.py --resume continues from.
  checkpoint_freq: 50_000

curriculum:
  # Gate: the Wilson lower bound (one-sided 95%) of the pooled two-seat win
  # rate (a draw counts as a loss) must reach promotion_win_rate on
  # `patience` consecutive evals. Each stage names its intended stochastic
  # win rate t; its threshold is
  #   T = round(wilson_lower_bound(ceil(120 * t), 120, z_for_confidence(0.95)), 2)
  # (reinforcetactics.rl.evaluation): t 0.85 / 0.80 / 0.75 / 0.70 / 0.65 /
  # 0.60 / 0.50 gives T 0.79 / 0.73 / 0.68 / 0.63 / 0.58 / 0.53 / 0.43. A
  # policy at t passes one eval 46-55% of the time and at t + 0.05 84-95% of
  # the time; one at t - 0.05 promotes within 10 evals 3.5-11.5% of the time.
  # T needs k_min wins of the 120 pooled episodes (61 at t 0.50, 73 at 0.60,
  # 85 at 0.70), so no seat can pass alone: 60/60 in seat 1 still needs 13
  # seat-2 wins at t 0.60. t is capped by what the scripted bots achieve
  # against the stage's opponent in both seats (the ladder cache; checked by
  # tests/test_bootstrap_ladder_order.py): at most the best bot's pooled
  # win rate on a bridge stage, and on a map top at most an even 0.50 unless
  # a bot does better (docs/validation_run_config.md section 4).
  promotion_criterion: wilson
  promotion_confidence: 0.95
  promotion_score: win_rate
  # A stalled stage gets one more budget from its best_model.zip.
  max_retries: 1
  # Restore best_model.zip after 3 consecutive evals whose stochastic win
  # rate is more than 0.25 below the stage's best, and keep training.
  regression_guard_evals: 3
  regression_guard_drop: 0.25
  # Stage order: every stage's opponent rates at least as strong as the
  # previous stage's on the same map and does not lose their head-to-head,
  # measured with the scripted-bot ladder (both seats). Evidence per step in
  # docs/validation_run_config.md; re-check after any bot or engine change:
  #   python scripts/eval/bot_ladder.py --config configs/ppo/bootstrap.yaml \
  #       --seeds 25 --fail-on-flag --out-dir <dir>
  # Every stage has patience 2 and min_timesteps_before_promotion 25_000
  # (the stage-entry eval of the carry-in policy cannot count toward
  # promotion). anneal_horizon ends each entropy schedule near the steps a
  # stage is expected to need.
  stages:
    # ---- starter (20 turns): cold start ----
    # An untrained policy plays like RandomBot, which beats SimpleBot on this
    # map, so SimpleBot is the warm-up.
    - name: starter_simple
      map_file: maps/1v1/starter.csv
      opponent: simple
      promotion_win_rate: 0.73      # t 0.80
      patience: 2
      max_timesteps: 500_000
      anneal_horizon: 300_000
      min_timesteps_before_promotion: 25_000
      ent_coef: {start: 0.10, end: 0.05, schedule: linear}

    - name: starter_mixed_random_simple
      map_file: maps/1v1/starter.csv
      opponent: mixed
      opponent_kwargs: {easy: random, hard: simple, p_hard: 0.5}
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 500_000
      anneal_horizon: 300_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    - name: starter_random
      map_file: maps/1v1/starter.csv
      opponent: random
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 750_000
      anneal_horizon: 400_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    - name: starter_mixed_random_medium
      map_file: maps/1v1/starter.csv
      opponent: mixed
      opponent_kwargs: {easy: random, hard: medium, p_hard: 0.5}
      # t 0.60: the best scripted bot wins 0.62-0.66 of its games against
      # this mix (MediumBot: 0.92 moving first, 0.40 moving second).
      promotion_win_rate: 0.53      # t 0.60
      patience: 2
      max_timesteps: 1_000_000
      anneal_horizon: 500_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    # Map top. t 0.50 on the MediumBot map tops and on corner_points_simple:
    # no scripted bot wins more than 0.40 of its games against these
    # opponents (0.34-0.36 here), and MediumBot moving first is beaten in at
    # most 24% of games (RandomBot). t 0.50 needs 61 of the 120 pooled wins,
    # which a policy that wins nearly every seat-1 game reaches; t 0.60 (73)
    # would need 13+ seat-2 wins even with a perfect seat 1.
    - name: starter_medium
      map_file: maps/1v1/starter.csv
      opponent: medium
      promotion_win_rate: 0.43      # t 0.50
      patience: 2
      max_timesteps: 1_500_000
      anneal_horizon: 750_000
      min_timesteps_before_promotion: 25_000
      ent_coef: 0.05

    # ---- beginner (6x6, 75 turns) ----
    - name: beginner_balanced_random
      map_file: maps/1v1/beginner.csv
      opponent: balanced_random
      promotion_win_rate: 0.79      # t 0.85
      patience: 2
      max_timesteps: 1_000_000
      anneal_horizon: 300_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    # RandomBots draw each other (99-100% of games), so their head-to-head
    # measures nothing. The step shows in how hard each is to beat: the
    # scripted bots win 0.958 of games against balanced_random, 0.719
    # against random_10 and 0.610 against random_15.
    - name: beginner_random_10
      map_file: maps/1v1/beginner.csv
      opponent: random
      opponent_kwargs: {max_actions: 10}
      promotion_win_rate: 0.68      # t 0.75
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    # The historical wall (the archive's stall stage). A lower entropy floor
    # so the policy commits late in the budget.
    - name: beginner_random_15
      map_file: maps/1v1/beginner.csv
      opponent: random
      opponent_kwargs: {max_actions: 15}
      promotion_win_rate: 0.63      # t 0.70
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.01, schedule: linear}

    # t 0.60: the best scripted bot wins 0.68-0.70 of its games against this
    # mix (MediumBot: 1.00 moving first, 0.40 moving second).
    - name: beginner_mixed_50
      map_file: maps/1v1/beginner.csv
      opponent: mixed
      opponent_kwargs: {easy: simple, hard: medium, p_hard: 0.5}
      promotion_win_rate: 0.53      # t 0.60
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # Before beginner_medium: since the rule-bot legality fix MediumBot
    # beats AdvancedBot, so this mix sits between mix(simple/medium) and
    # pure MediumBot. t 0.60: the best scripted bot wins 0.60-0.70 of its
    # games against it (MediumBot: 0.96-1.00 moving first, 0.24-0.40 second).
    - name: beginner_mixed_med_adv_50
      map_file: maps/1v1/beginner.csv
      opponent: mixed
      opponent_kwargs: {easy: medium, hard: advanced, p_hard: 0.5}
      promotion_win_rate: 0.53      # t 0.60
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # Map top (see starter_medium): the best scripted bot wins 0.36-0.40 of
    # its games against MediumBot here; moving second, at most 16-24%.
    - name: beginner_medium
      map_file: maps/1v1/beginner.csv
      opponent: medium
      promotion_win_rate: 0.43      # t 0.50
      patience: 2
      max_timesteps: 4_000_000
      anneal_horizon: 2_000_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # ---- intermediate (7x7, 3 neutrals on the anti-diagonal, 75 turns) ----
    # The first map with contested neutrals, and water in the off-corners so
    # both sides must engage through the centre. 75 turns, not 60: 25-34% of
    # v52a's decisive intermediate games ended after turn 60, and v34, the
    # only run at 60, stalled with every game drawn at the clock.
    - name: intermediate_balanced_random
      map_file: maps/1v1/intermediate.csv
      opponent: balanced_random
      promotion_win_rate: 0.79      # t 0.85
      patience: 2
      max_timesteps: 1_000_000
      anneal_horizon: 300_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    # Replaces random_20 and mix(random/simple), which were no step: they
    # draw each other and SimpleBot (0.49-0.52 head to head).
    - name: intermediate_mixed_br_simple
      map_file: maps/1v1/intermediate.csv
      opponent: mixed
      opponent_kwargs: {easy: balanced_random, hard: simple, p_hard: 0.5}
      promotion_win_rate: 0.63      # t 0.70
      patience: 2
      max_timesteps: 2_000_000
      anneal_horizon: 1_000_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: {start: 0.07, end: 0.03, schedule: linear}

    # The capture race against a capture-greedy bot: a new skill, not a
    # transfer, hence t 0.65.
    - name: intermediate_simple
      map_file: maps/1v1/intermediate.csv
      opponent: simple
      promotion_win_rate: 0.58      # t 0.65
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # Splits the simple -> medium step, the largest on this map. t 0.60: the
    # best scripted bot wins 0.66-0.70 of its games against this mix.
    - name: intermediate_mixed_simple_medium
      map_file: maps/1v1/intermediate.csv
      opponent: mixed
      opponent_kwargs: {easy: simple, hard: medium, p_hard: 0.5}
      promotion_win_rate: 0.53      # t 0.60
      patience: 2
      max_timesteps: 3_000_000
      anneal_horizon: 1_500_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # Map top (see starter_medium): the best scripted bot wins 0.36-0.38 of
    # its games against MediumBot here; moving second, at most 4-8%.
    - name: intermediate_medium
      map_file: maps/1v1/intermediate.csv
      opponent: medium
      promotion_win_rate: 0.43      # t 0.50
      patience: 2
      max_timesteps: 4_000_000
      anneal_horizon: 2_000_000
      min_timesteps_before_promotion: 25_000
      max_turns: 75
      max_steps: 4700
      ent_coef: 0.05

    # ---- skirmish (8x8, 4 neutral buildings, 120 turns) ----
    # No RandomBot stages: random_10/15/20 draw each other and every strong
    # bot beats them, so they add no step (v52a cleared them at 1.0).
    - name: skirmish_balanced_random
      map_file: maps/1v1/skirmish.csv
      opponent: balanced_random
      promotion_win_rate: 0.79      # t 0.85
      patience: 2
      max_timesteps: 1_000_000
      anneal_horizon: 300_000
      min_timesteps_before_promotion: 25_000
      max_turns: 120
      max_steps: 7400
      ent_coef: {start: 0.10, end: 0.03, schedule: linear}

    - name: skirmish_mixed_br_simple
      map_file: maps/1v1/skirmish.csv
      opponent: mixed
      opponent_kwargs: {easy: balanced_random, hard: simple, p_hard: 0.5}
